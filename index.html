<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Runner</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Agent Runner</h1>

    <div class="form-group">
      <label for="agent-select">Agent</label>
      <select id="agent-select">
        <option value="" disabled selected>Loading agents…</option>
      </select>
    </div>

    <div class="form-group">
      <label for="input-text">Input</label>
      <textarea id="input-text" placeholder="Optional flags, e.g. --dry-run   or   --scraper himalayas   (leave blank to run the full pipeline)" rows="6"></textarea>
    </div>

    <button id="start-btn" disabled>Start</button>

    <div class="form-group output-group" id="output-group" style="display:none">
      <label for="output-text">Output</label>
      <div id="output-text" class="output-box"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
