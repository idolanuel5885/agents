[build]
builder = "nixpacks"
buildCommand = "pip install -r requirements.txt && for d in agents/*/; do [ -f \"$d/requirements.txt\" ] && pip install -r \"$d/requirements.txt\"; done && playwright install chromium --with-deps"

[deploy]
startCommand = "uvicorn server:app --host 0.0.0.0 --port $PORT"
restartPolicyType = "on_failure"
